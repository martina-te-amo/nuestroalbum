<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Álbum</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f7f8fa; color: #333; padding: 20px 15px; text-align: center; }
        h1 { font-size: 1.6rem; color: #e63946; margin-bottom: 8px; }
        p.subtitle { font-size: 0.95rem; color: #666; margin-bottom: 20px; }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            max-width: 500px;
            margin: 0 auto 30px auto;
        }

        .slot {
            background: #fff;
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 180px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .slot-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #444; }
        
        .preview-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            display: none;
            margin-bottom: 8px;
        }

        .file-input { display: none; }
        
        .btn-upload {
            background-color: #e63946;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
            width: 100%;
        }

        .btn-upload.loaded { background-color: #2a9d8f; }
    </style>
</head>
<body>

    <h1>Nuestro Reto de Fotos 📸</h1>
    <p class="subtitle">Pendientes por llenar juntos...</p>

    <div class="grid-container" id="grid"></div>

    <script>
        // AQUÍ PUEDES CAMBIAR LAS FRASES DE LAS 10 FOTOS:
        const retos = [
            "Foto en la playa 🏖️",
            "Comiendo algo rico 🍕",
            "Un atardecer 🌅",
            "Foto divertida / mueca 🤪",
            "Un abrazo fuerte 🫂",
            "En un parque/naturaleza 🍃",
            "Tomando un café/trago ☕",
            "Foto en el auto/viaje 🚗",
            "Una foto espejo 🪞",
            "Cualquier momento juntos ✨"
        ];

        const grid = document.getElementById('grid');

        retos.forEach((reto, index) => {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slot.innerHTML = `
                <span class="slot-title">${reto}</span>
                <img id="img-${index}" class="preview-img" src="" alt="Vista previa">
                <input type="file" accept="image/*" id="input-${index}" class="file-input" onchange="cargarImagen(event, ${index})">
                <button class="btn-upload" id="btn-${index}" onclick="document.getElementById('input-${index}').click()">Subir foto</button>
            `;
            grid.appendChild(slot);
        });

        function cargarImagen(event, index) {
            const reader = new FileReader();
            reader.onload = function() {
                const img = document.getElementById(`img-${index}`);
                const btn = document.getElementById(`btn-${index}`);
                img.src = reader.result;
                img.style.display = 'block';
                btn.textContent = 'Cambiar foto';
                btn.classList.add('loaded');
            }
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }
    </script>
</body>
</html>

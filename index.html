<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Álbum</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #d8eae0 0%, #c4dfd0 50%, #eaf4ee 100%);
            color: #1a241f; 
            padding: 25px 15px; 
            text-align: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .decor-bg {
            position: fixed;
            opacity: 0.28;
            pointer-events: none;
            z-index: 0;
        }
        .decor-snoopy-1 { top: 2%; left: -10px; width: 90px; }
        .decor-gumball-1 { top: 20%; right: -10px; width: 85px; }
        .decor-snoopy-2 { bottom: 20%; left: -10px; width: 85px; }
        .decor-gumball-2 { bottom: 2%; right: -10px; width: 90px; }

        .content-wrapper {
            position: relative;
            z-index: 1;
        }

        h1 { 
            font-size: 1.6rem; 
            color: #111827; 
            margin-bottom: 6px; 
            font-weight: 700; 
            letter-spacing: -0.3px;
        }

        p.subtitle { 
            font-size: 0.9rem; 
            color: #374151; 
            margin-bottom: 25px; 
            line-height: 1.4;
            padding: 0 10px;
            font-weight: 500;
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 450px;
            margin: 0 auto;
        }

        .slot {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1.5px dashed #8ebdaa;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 200px;
            box-shadow: 0 8px 18px rgba(43, 84, 66, 0.08);
            transition: all 0.3s ease;
        }

        .slot-title { 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: #1f2937;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .preview-container {
            width: 100%;
            height: 110px;
            background-color: #f0f7f3;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .placeholder-icon {
            font-size: 1.6rem;
            opacity: 0.5;
        }

        .file-input { display: none; }
        
        .btn-upload {
            background: #ffffff;
            color: #111827;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid #e5e7eb;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }

        .btn-upload.loaded { 
            background: linear-gradient(135deg, #2e8b60 0%, #1e6343 100%);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 10px rgba(30, 99, 67, 0.3);
        }
    </style>
</head>
<body>

    <!-- Enlaces directos a CDN sin bloqueos -->
    <img src="https://pngimg.com/uploads/snoopy/snoopy_PNG1.png" class="decor-bg decor-snoopy-1" alt="Snoopy">
    <img src="https://raw.githubusercontent.com/tobi512/Gumball/main/gumball.png" class="decor-bg decor-gumball-1" alt="Gumball" onerror="this.src='https://cdn-icons-png.flaticon.com/512/742/742751.png'">
    <img src="https://pngimg.com/uploads/snoopy/snoopy_PNG25.png" class="decor-bg decor-snoopy-2" alt="Snoopy">
    <img src="https://raw.githubusercontent.com/tobi512/Gumball/main/gumball.png" class="decor-bg decor-gumball-2" alt="Gumball" onerror="this.src='https://cdn-icons-png.flaticon.com/512/742/742751.png'">

    <div class="content-wrapper">
        <h1>Nuestro reto de fotos, Renato y Martina :D</h1>
        <p class="subtitle">Sin presión, deberíamos salir a rellenar todas estas fotos...</p>

        <div class="grid-container" id="grid"></div>
    </div>

    <script>
        const retos = [
            "Foto en la playa",
            "Comiendo hamburguesas",
            "Una foto de noche con aura jeje",
            "Haciéndonos skincare",
            "Un abrazo fuerte",
            "En un parque/naturaleza",
            "Tomando un café",
            "Foto juntos en un auto",
            "Una foto espejo",
            "Yo tomándote porque me gusta tomarte",
            "Foto en el happyland",
            "Foto en el cine",
            "Foto en el colegio"
        ];

        const grid = document.getElementById('grid');

        retos.forEach((reto, index) => {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slot.innerHTML = `
                <span class="slot-title">${reto}</span>
                <div class="preview-container">
                    <span id="icon-${index}" class="placeholder-icon">📷</span>
                    <img id="img-${index}" class="preview-img" alt="Vista previa">
                </div>
                <input type="file" accept="image/*" id="input-${index}" class="file-input" onchange="cargarImagen(event, ${index})">
                <button class="btn-upload" id="btn-${index}" onclick="document.getElementById('input-${index}').click()">Subir foto</button>
            `;
            grid.appendChild(slot);
        });

        function cargarImagen(event, index) {
            const reader = new FileReader();
            reader.onload = function() {
                const img = document.getElementById(`img-${index}`);
                const icon = document.getElementById(`icon-${index}`);
                const btn = document.getElementById(`btn-${index}`);
                
                img.src = reader.result;
                img.style.display = 'block';
                icon.style.display = 'none';
                
                btn.textContent = '✓ Cambiar foto';
                btn.classList.add('loaded');
            }
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Álbum</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            /* Fondo degradado suave: De rojo burdeos/rosa muy claro a un toque salvia/verde suave */
            background: linear-gradient(135deg, #fff2f2 0%, #f4f8f5 100%);
            color: #383838; 
            padding: 25px 15px; 
            text-align: center;
            min-height: 100vh;
        }

        /* Título en Rojo Granate/Vino (Elegante y no chillón) */
        h1 { 
            font-size: 1.7rem; 
            color: #b83b49; 
            margin-bottom: 6px; 
            font-weight: 700; 
            letter-spacing: -0.3px;
        }

        /* Subtítulo suave */
        p.subtitle { 
            font-size: 0.9rem; 
            color: #6b7280; 
            margin-bottom: 25px; 
            line-height: 1.4;
            padding: 0 10px;
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 450px;
            margin: 0 auto;
        }

        /* Tarjetas estilo cristal con borde rojo pastel muy suave */
        .slot {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1.5px dashed #f3c1c6;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 200px;
            box-shadow: 0 8px 18px rgba(184, 59, 73, 0.05);
            transition: all 0.3s ease;
        }

        .slot-title { 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: #4a5568;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .preview-container {
            width: 100%;
            height: 110px;
            background-color: #faf5f5;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .placeholder-icon {
            font-size: 1.6rem;
            opacity: 0.5;
        }

        .file-input { display: none; }
        
        /* Botón Inicial: Rojo cálido/elegante */
        .btn-upload {
            background: linear-gradient(135deg, #d64554 0%, #b83b49 100%);
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            width: 100%;
            box-shadow: 0 4px 10px rgba(184, 59, 73, 0.25);
            transition: all 0.3s ease;
        }

        /* Botón al cargar foto: Verde esmeralda/salvia suave por los ojos de ella */
        .btn-upload.loaded { 
            background: linear-gradient(135deg, #489379 0%, #35725e 100%);
            box-shadow: 0 4px 10px rgba(53, 114, 94, 0.25);
        }
    </style>
</head>
<body>

    <h1>Nuestro reto de fotos, Renato y Martina :D</h1>
    <p class="subtitle">Pendientes por llenar juntos..., sin presiones, lento, sin apurar las cosas....</p>

    <div class="grid-container" id="grid"></div>

    <script>
        // TUS 13 OPCIONES INTACATAS
        const retos = [
            "Foto en la playa 🏖️",
            "Comiendo hamburgesas 🍔",
            "Una foto de noche con aura jeje ✨",
            "Haciendonos skincare 🧖‍♀️",
            "Un abrazo fuerte 🫂",
            "En un parque/naturaleza 🍃",
            "Tomando un cafe ☕",
            "Foto juntos en un auto 🚗",
            "Una foto espejo 🪞",
            "Yo tomandote porque me gusta tomarte 📸",
            "Foto en el happyland 🎟️",
            "Foto en el cine 🍿",
            "Foto en el colegio 🏫"
        ];

        const grid = document.getElementById('grid');

        retos.forEach((reto, index) => {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slot.innerHTML = `
                <span class="slot-title">${reto}</span>
                <div class="preview-container">
                    <span id="icon-${index}" class="placeholder-icon">📷</span>
                    <img id="img-${index}" class="preview-img" alt="Vista previa">
                </div>
                <input type="file" accept="image/*" id="input-${index}" class="file-input" onchange="cargarImagen(event, ${index})">
                <button class="btn-upload" id="btn-${index}" onclick="document.getElementById('input-${index}').click()">Subir foto</button>
            `;
            grid.appendChild(slot);
        });

        function cargarImagen(event, index) {
            const reader = new FileReader();
            reader.onload = function() {
                const img = document.getElementById(`img-${index}`);
                const icon = document.getElementById(`icon-${index}`);
                const btn = document.getElementById(`btn-${index}`);
                
                img.src = reader.result;
                img.style.display = 'block';
                icon.style.display = 'none';
                
                btn.textContent = '✓ Cambiar foto';
                btn.classList.add('loaded');
            }
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }
    </script>
</body>
</html>
